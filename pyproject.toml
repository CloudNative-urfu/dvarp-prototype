[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darp-range"
version = "0.0.0"
description = "DARP zero-version: polygon for evaluating guardrails in a refund-support agent"
requires-python = ">=3.11"
# Рантайм и офлайн-проверки — только стандартная библиотека (см. assumptions «Стек и зависимости»).
dependencies = []

[project.optional-dependencies]
# Адаптеры тяжёлых OSS-детекторов (выключены по умолчанию); версии закрепляются
# на стадии реализации адаптеров вместе с хешами весов.
detectors = []

[tool.setuptools]
packages = { find = { include = ["darp_range*"] } }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["revisions"]

[tool.ruff.lint]
# Минимальный набор (без E501: кодовая база не следует единой длине строк).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Замороженный defense-код (хеши директорий в configs.lock.json): файлы не редактируются
# до перезаморозки, поэтому локальные легаси-предупреждения отключаются точечно.
"darp_range/configs/process.py" = ["F401"]
"darp_range/guard_plugins/adapters.py" = ["F401"]
"darp_range/guard_plugins/builtin.py" = ["F541"]
"darp_range/guard_policy/pipeline.py" = ["F401"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = false
bump_message = "chore(release): $current_version -> $new_version"
