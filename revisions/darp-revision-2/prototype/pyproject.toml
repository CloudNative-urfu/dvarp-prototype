[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darp-range"
version = "0.0.0"
description = "DARP zero-version: polygon for evaluating guardrails in a refund-support agent"
requires-python = ">=3.11"
# Рантайм и офлайн-проверки — только стандартная библиотека (см. assumptions «Стек и зависимости»).
dependencies = []

[project.optional-dependencies]
# Адаптеры тяжёлых OSS-детекторов (выключены по умолчанию); версии закрепляются
# на стадии реализации адаптеров вместе с хешами весов.
detectors = []

[tool.setuptools]
packages = { find = { include = ["darp_range*"] } }
